<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKYPE Depth Viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SKYPE Interactive Depth Viewer</p>
      <h1 id="sample-name">Loading…</h1>
      <p id="dataset-summary" class="summary">Reading depth arrays</p>
    </div>
    <div class="controls" aria-label="View controls">
      <label class="line-width-control" for="line-width">
        <span>Line width</span>
        <input id="line-width" type="range" min="0.5" max="5" step="0.1" value="1.6">
        <output id="line-width-value" for="line-width">1.6×</output>
      </label>
      <span id="zoom-value" class="zoom-value">100%</span>
      <button id="reset-view" type="button">Reset view</button>
    </div>
  </header>

  <main>
    <section class="chart-card" aria-label="Circular depth plot">
      <div id="canvas-wrap" class="canvas-wrap">
        <canvas id="depth-canvas"></canvas>
        <div id="tooltip" class="tooltip" role="status" hidden></div>
        <div id="loading" class="loading">Loading SKYPE depth data…</div>
      </div>
      <div class="chart-footer">
        <div class="legend" aria-label="Depth line legend">
          <span><i class="line reference"></i>Reference depth (B.npy)</span>
          <span><i class="line predicted"></i>Predicted depth</span>
          <span><i class="line low-threshold"></i>0.5× median</span>
          <span><i class="line high-threshold"></i>2× median</span>
        </div>
        <p>Wheel to zoom around the pointer · drag to pan · double-click to reset</p>
      </div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
